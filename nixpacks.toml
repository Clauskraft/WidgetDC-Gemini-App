# Nixpacks build env — pin Node 22 (foundation requires >=22) and npm 10.
[phases.setup]
nixPkgs = ["nodejs_22", "npm-10_x"]

# Use `npm install` (not the default `npm ci`): the lockfile is generated on
# Windows, where npm omits Linux-only optional native deps (@emnapi/*, platform
# rollup/esbuild binaries). `npm ci` is strict and fails on that mismatch on
# Railway's Linux builders.
#
# `--include=dev` is REQUIRED: the service sets NODE_ENV=production, which makes
# npm skip devDependencies — but the build tool (@lovable.dev/vite-tanstack-config,
# vite, etc.) lives in devDependencies. Without this the build fails with
# "Cannot find package '@lovable.dev/vite-tanstack-config'".
[phases.install]
cmds = ["npm install --include=dev --no-audit --no-fund"]
